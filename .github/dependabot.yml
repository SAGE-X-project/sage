# Dependabot configuration for SAGE
# Automated dependency updates

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 10
    reviewers:
      - "SAGE-X-project/sage-core-dev"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 5
    # Actions are pinned to commit SHAs; Dependabot keeps the SHA and the
    # version comment in sync. One grouped PR per week instead of one per action.
    groups:
      actions:
        patterns:
          - "*"
    reviewers:
      - "SAGE-X-project/sage-core-dev"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # npm (Smart Contracts)
  - package-ecosystem: "npm"
    directory: "/contracts/ethereum"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 10
    reviewers:
      - "SAGE-X-project/sage-core-dev"
    labels:
      - "dependencies"
      - "contracts"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase

  # Docker (root Dockerfile and deployments/docker/Dockerfile are pinned by digest)
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/deployments/docker"
    # The golang builder image follows go.mod's toolchain directive; only
    # patch releases of the same minor are taken automatically.
    ignore:
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 5
    reviewers:
      - "SAGE-X-project/sage-core-dev"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  # Docker Compose (development and test stacks, pinned by digest)
  - package-ecosystem: "docker-compose"
    directory: "/deployments/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  # Experimental language clients (sdk/): keep them buildable, one grouped PR each
  - package-ecosystem: "pip"
    directory: "/sdk/python"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-sdk:
        patterns: ["*"]
    labels: ["dependencies", "sdk"]
    commit-message:
      prefix: "chore(sdk-python)"
    # The clients are experimental and pinned to the major versions they were
    # written against; majors are taken deliberately when the client is reworked.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      typescript-sdk:
        patterns: ["*"]
    labels: ["dependencies", "sdk"]
    commit-message:
      prefix: "chore(sdk-typescript)"
    # The clients are experimental and pinned to the major versions they were
    # written against; majors are taken deliberately when the client is reworked.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/sdk/rust/sage-client"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      rust-sdk:
        patterns: ["*"]
    labels: ["dependencies", "sdk"]
    commit-message:
      prefix: "chore(sdk-rust)"
    # The clients are experimental and pinned to the major versions they were
    # written against; majors are taken deliberately when the client is reworked.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "maven"
    directory: "/sdk/java/sage-client"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      java-sdk:
        patterns: ["*"]
    labels: ["dependencies", "sdk"]
    commit-message:
      prefix: "chore(sdk-java)"
    # The clients are experimental and pinned to the major versions they were
    # written against; majors are taken deliberately when the client is reworked.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
