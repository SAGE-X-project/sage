# Dependabot configuration for SAGE
# Automated dependency updates

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 10
    # These releases set "go 1.26" in their go.mod and would raise this
    # module's go directive above the supported toolchain (Go 1.25.2).
    # Remove once the toolchain is upgraded.
    ignore:
      - dependency-name: "golang.org/x/crypto"
        versions: [">=0.56.0"]
      - dependency-name: "golang.org/x/sync"
        versions: [">=0.23.0"]
    reviewers:
      - "sage-x-project/maintainers"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 5
    # Actions are pinned to commit SHAs; Dependabot keeps the SHA and the
    # version comment in sync. One grouped PR per week instead of one per action.
    groups:
      actions:
        patterns:
          - "*"
    reviewers:
      - "sage-x-project/maintainers"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # npm (Smart Contracts)
  - package-ecosystem: "npm"
    directory: "/contracts/ethereum"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sage-x-project/maintainers"
    labels:
      - "dependencies"
      - "contracts"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 5
    reviewers:
      - "sage-x-project/maintainers"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
