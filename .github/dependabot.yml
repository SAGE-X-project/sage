# Dependabot configuration for SAGE
# Automated dependency updates

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sage-x-project/maintainers"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 5
    # Actions are pinned to commit SHAs; Dependabot keeps the SHA and the
    # version comment in sync. One grouped PR per week instead of one per action.
    groups:
      actions:
        patterns:
          - "*"
    reviewers:
      - "sage-x-project/maintainers"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # npm (Smart Contracts)
  - package-ecosystem: "npm"
    directory: "/contracts/ethereum"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sage-x-project/maintainers"
    labels:
      - "dependencies"
      - "contracts"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase

  # Docker (root Dockerfile and deployments/docker/Dockerfile are pinned by digest)
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/deployments/docker"
    # The golang builder image follows go.mod's toolchain directive; only
    # patch releases of the same minor are taken automatically.
    ignore:
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 5
    reviewers:
      - "sage-x-project/maintainers"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  # Docker Compose (development and test stacks, pinned by digest)
  - package-ecosystem: "docker-compose"
    directory: "/deployments/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
