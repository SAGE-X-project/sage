name: Core module

on:
  push:
    branches: [main, dev, 'spec/**']
    paths:
      - 'core/**'
      - '.github/workflows/core.yml'
  pull_request:
    branches: [main, dev, 'spec/**']
    paths:
      - 'core/**'
      - '.github/workflows/core.yml'

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.11'
  GOTOOLCHAIN: auto
  GOFLAGS: -mod=readonly

defaults:
  run:
    working-directory: core

jobs:
  test:
    name: Core test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check dependency budget and forbidden patterns
        run: ./scripts/check-budget.sh
      - name: Run go vet
        run: go vet ./...
      - name: Run tests with the race detector
        run: go test -race -count=1 ./...
      - name: Fuzz the log detail escaping
        run: go test -run='^$' -fuzz=FuzzUnverified -fuzztime=30s ./obs
      - name: Fuzz the vector file reader
        run: go test -run='^$' -fuzz=FuzzReadFile -fuzztime=30s ./vectors
      - name: Fuzz the vector check
        run: go test -run='^$' -fuzz=FuzzCheck -fuzztime=30s ./vectors
      - name: Fuzz the strict JSON parser
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=30s ./jcs
      - name: Fuzz the signature parser
        run: go test -run='^$' -fuzz=FuzzParseSignature -fuzztime=30s ./crypto
      - name: Fuzz the public key parser
        run: go test -run='^$' -fuzz=FuzzParsePublicKey -fuzztime=30s ./crypto

  lint:
    name: Core lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.mod
      - name: Install verified golangci-lint
        timeout-minutes: 5
        run: |
          if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
            printf 'Unsupported linter platform: %s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2
            exit 1
          fi
          lint_archive="$RUNNER_TEMP/golangci-lint-2.13.2-linux-amd64.tar.gz"
          lint_directory="$RUNNER_TEMP/golangci-lint-2.13.2-linux-amd64"
          mkdir -p "$lint_directory"
          # Both download paths identify the same pinned official release asset.
          if ! curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --retry 1 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 --output "$lint_archive" 'https://github.com/golangci/golangci-lint/releases/download/v2.13.2/golangci-lint-2.13.2-linux-amd64.tar.gz'; then
            curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' --output "$lint_archive" 'https://api.github.com/repos/golangci/golangci-lint/releases/assets/532995333'
          fi
          printf '%s  %s\n' '2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6' "$lint_archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$lint_archive" --directory "$lint_directory" --strip-components=1 --no-same-owner --no-same-permissions 'golangci-lint-2.13.2-linux-amd64/golangci-lint'
          test -f "$lint_directory/golangci-lint"
          test ! -L "$lint_directory/golangci-lint"
          chmod u+x "$lint_directory/golangci-lint"
          "$lint_directory/golangci-lint" version
          printf '%s\n' "$lint_directory" >> "$GITHUB_PATH"
      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...
