name: SDK Build

# The clients under sdk/ are experimental (see README, "Multi-Language
# Bindings"). This workflow only keeps them compiling and their unit tests
# green; it does not assert interoperability with the Go core.

on:
  push:
    branches: [main]
    paths: ["sdk/**", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["sdk/**", ".github/workflows/sdk.yml"]

permissions:
  contents: read

jobs:
  python:
    name: Python client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python -m pytest tests -q

  typescript:
    name: TypeScript client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts
      # Type checking is not enforced yet: src/react imports the optional
      # peer dependency (D-08 follow-up).
      - run: npx vitest run --passWithNoTests

  rust:
    name: Rust client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust/sage-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo build --locked
      - run: cargo test --locked

  java:
    name: Java client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java/sage-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -q -DskipTests=false test
