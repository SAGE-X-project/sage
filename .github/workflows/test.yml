name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.10'
  GOTOOLCHAIN: auto
  GOFLAGS: -mod=readonly

jobs:
  # Keep finite runner headroom for race-enabled Registry evidence.
  # The required Go Tests job explicitly gates on this job's success.
  registry_source_checks:
    name: Registry Source Checks
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download && go mod verify

      - name: Verify Registry Source clock and checkpoint checks
        run: |
          mkdir -p "$RUNNER_TEMP/registry-source-checks/source"
          go version > "$RUNNER_TEMP/registry-source-checks/compiler.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/registry-source-checks/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/registry-source-checks/tree.txt"
          git ls-files -z pkg/agent/registry011 docs/dev/registry-source-checks.md docs/dev/agent-embedding.md docs/INDEX.md go.mod go.sum .github/workflows/test.yml .github/workflows/registry-node-evidence.yml .gitleaks.toml | xargs -0 sha256sum > "$RUNNER_TEMP/registry-source-checks/source.sha256"
          cp pkg/agent/registry011/*.go pkg/agent/registry011/*.json "$RUNNER_TEMP/registry-source-checks/source/"
          cp -R pkg/agent/registry011/testdata "$RUNNER_TEMP/registry-source-checks/source/"
          python3 - <<'PYSOURCE'
          import json, os
          from pathlib import Path
          names = ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_REF', 'GITHUB_REPOSITORY']
          Path(os.environ['RUNNER_TEMP'], 'registry-source-checks', 'context.json').write_text(json.dumps({name: os.environ[name] for name in names}, indent=2) + '\n')
          PYSOURCE
          go test -mod=readonly -race -count=1 -timeout=60m -json -coverprofile="$RUNNER_TEMP/registry-source-checks/coverage.out" -covermode=atomic ./pkg/agent/registry011 > "$RUNNER_TEMP/registry-source-checks/tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/registry-source-checks/coverage.out" > "$RUNNER_TEMP/registry-source-checks/functions.txt"
          git diff --exit-code

      - name: Retain Registry Source clock and checkpoint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-source-checks
          path: ${{ runner.temp }}/registry-source-checks/
          if-no-files-found: error
          retention-days: 14

  # Go tests with the race detector. The job name carries no Go version so
  # the branch ruleset that requires it does not go stale on a toolchain bump.
  test-go:
    name: Go Tests
    needs: registry_source_checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Require successful Registry Source evidence
        env:
          REGISTRY_SOURCE_RESULT: ${{ needs.registry_source_checks.result }}
        run: test "$REGISTRY_SOURCE_RESULT" = "success"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download && go mod verify

      - name: Download successful Registry Source evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: registry-source-checks
          path: ${{ runner.temp }}/verified-registry-source

      - name: Verify Registry evidence and partition the complete package set
        run: |
          go list ./... > packages-all.txt
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP'], 'verified-registry-source')
          context = json.loads((source / 'context.json').read_text())
          for name in ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_REF', 'GITHUB_REPOSITORY']:
              if context.get(name) != os.environ[name]:
                  raise SystemExit(f'Registry Source evidence context mismatch: {name}')
          source_attempt = int(context['GITHUB_RUN_ATTEMPT'])
          if context.get('GITHUB_JOB') != 'registry_source_checks' or not 1 <= source_attempt <= int(os.environ['GITHUB_RUN_ATTEMPT']):
              raise SystemExit('Registry Source job or attempt mismatch')
          for filename, args in [('revision.txt', ['git', 'rev-parse', 'HEAD']), ('tree.txt', ['git', 'rev-parse', 'HEAD^{tree}']), ('compiler.txt', ['go', 'version'])]:
              if (source / filename).read_text() != subprocess.check_output(args, text=True):
                  raise SystemExit(f'Registry Source evidence identity mismatch: {filename}')
          paths = ['pkg/agent/registry011', 'docs/dev/registry-source-checks.md', 'docs/dev/agent-embedding.md', 'docs/INDEX.md', 'go.mod', 'go.sum', '.github/workflows/test.yml', '.github/workflows/registry-node-evidence.yml', '.gitleaks.toml']
          tracked = subprocess.check_output(['git', 'ls-files', '-z', *paths]).decode().split('\0')[:-1]
          expected = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in tracked}
          recorded = {}
          for line in (source / 'source.sha256').read_text().splitlines():
              digest, name = line.split('  ', 1)
              if name in recorded:
                  raise SystemExit('Duplicate Registry Source file identity')
              recorded[name] = digest
          if not expected or recorded != expected:
              raise SystemExit('Registry Source evidence does not match this complete source selection')
          registry = 'github.com/sage-x-project/sage/pkg/agent/registry011'
          passed, ran = 0, 0
          for line in (source / 'tests.jsonl').read_text().splitlines():
              event = json.loads(line)
              if event.get('Action') == 'fail':
                  raise SystemExit('Registry Source evidence contains a failed test')
              if event.get('Package') == registry:
                  passed += event.get('Action') == 'pass' and not event.get('Test')
                  ran += event.get('Action') == 'run' and bool(event.get('Test'))
          if passed != 1 or not ran:
              raise SystemExit('Registry Source evidence has no complete successful package run')
          packages = Path('packages-all.txt').read_text().splitlines()
          if len(packages) != len(set(packages)) or packages.count(registry) != 1:
              raise SystemExit('Complete package inventory must contain Registry exactly once')
          remaining = [name for name in packages if name != registry]
          if not remaining:
              raise SystemExit('Remaining package inventory is empty')
          Path('packages-other.txt').write_text('\n'.join(remaining) + '\n')
          receipt = {'registry_package': registry, 'source_run': context['GITHUB_RUN_ID'], 'source_attempt': source_attempt, 'consumer_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'revision': (source / 'revision.txt').read_text().strip(), 'registry_named_runs': ran, 'all_packages': packages, 'remaining_packages': remaining}
          Path('registry-source-reuse.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(f'Verified Registry Source package; running every other package: {len(remaining)} of {len(packages)}')
          PY

      - name: Run remaining tests with coverage and race detector
        shell: bash
        run: |
          mapfile -t packages < packages-other.txt
          go test -race -count=1 -timeout=60m -coverprofile=coverage-other.out -covermode=atomic "${packages[@]}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          prefix = 'github.com/sage-x-project/sage/pkg/agent/registry011/'
          registry = Path(os.environ['RUNNER_TEMP'], 'verified-registry-source', 'coverage.out')
          merged, seen = [], set()
          for path, is_registry in [(registry, True), (Path('coverage-other.out'), False)]:
              lines = path.read_text().splitlines()
              if len(lines) < 2 or lines[0] != 'mode: atomic':
                  raise SystemExit(f'Missing atomic coverage: {path}')
              for line in lines[1:]:
                  location, statements, count = line.split()
                  filename = location.rsplit(':', 1)[0]
                  if filename.startswith(prefix) != is_registry or location in seen or int(statements) < 0 or int(count) < 0:
                      raise SystemExit(f'Coverage source overlap or invalid row: {location}')
                  seen.add(location)
                  merged.append(line)
          Path('coverage.out').write_text('mode: atomic\n' + '\n'.join(merged) + '\n')
          PY
          go tool cover -html=coverage.out -o coverage.html

      - name: Check Registry observation and adapter coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = {
              'pkg/agent/internal/rfc8785/rfc8785.go': [0, 0],
              'pkg/agent/internal/rfc8785/native.go': [0, 0],
              'pkg/agent/registry010/eip155_observer010.go': [0, 0],
              'pkg/agent/didsource010/eip155.go': [0, 0],
              'pkg/agent/registry011/source_checkpoint.go': [0, 0],
              'pkg/agent/registry011/source_reconfiguration.go': [0, 0],
              'pkg/agent/registry011/source_retained.go': [0, 0],
              'pkg/agent/registry011/source_acquisition.go': [0, 0],
              'pkg/agent/registry011/source_batch.go': [0, 0],
              'pkg/agent/registry011/rpc_response.go': [0, 0],
              'pkg/agent/registry011/rpc_transport.go': [0, 0],
              'pkg/agent/registry011/rpc_reads.go': [0, 0],
              'pkg/agent/registry011/history_content.go': [0, 0],
              'pkg/agent/registry011/replay.go': [0, 0],
              'pkg/agent/registry011/replay_blocks.go': [0, 0],
              'pkg/agent/registry011/replay_gas.go': [0, 0],
              'pkg/agent/registry011/replay_stream.go': [0, 0],
              'pkg/agent/registry011/replay_journal.go': [0, 0],
              'pkg/agent/registry011/journal_disk.go': [0, 0],
              'pkg/agent/registry011/replay_commands.go': [0, 0],
              'pkg/agent/registry011/replay_execution.go': [0, 0],
              'pkg/agent/registry011/replay_framing.go': [0, 0],
              'pkg/agent/registry011/replay_proofs.go': [0, 0],
              'pkg/agent/registry011/replay_schema.go': [0, 0],
              'pkg/agent/registry011/replay_state.go': [0, 0],
              'pkg/agent/registry011/node_blocks.go': [0, 0],
              'pkg/agent/registry011/node_json.go': [0, 0],
              'pkg/agent/registry011/node_gas.go': [0, 0],
              'pkg/agent/registry011/node_root_gas.go': [0, 0],
              'pkg/agent/registry011/node_trace.go': [0, 0],
              'pkg/agent/registry011/provider_policy.go': [0, 0],
              'pkg/agent/registry011/provider_policy_schema.go': [0, 0],
              'pkg/agent/registry011/provider_enrollment.go': [0, 0],
              'pkg/agent/registry011/provider_enrollment_schema.go': [0, 0],
              'pkg/agent/registry011/provider_enrollment_disk.go': [0, 0],
              'pkg/agent/registry011/provider_budget.go': [0, 0],
              'pkg/agent/registry011/retention_candidate.go': [0, 0],
              'pkg/agent/registry011/retention_candidate_disk.go': [0, 0],
              'pkg/agent/registry011/retention_lock_supported.go': [0, 0],
              'pkg/agent/registry011/admission_candidate_root.go': [0, 0],
              'pkg/agent/registry011/admission_candidate_intent.go': [0, 0],
              'pkg/agent/registry011/admission_candidate_ticket.go': [0, 0],
              'pkg/agent/registry011/admission_candidate_consumption.go': [0, 0],
              'pkg/agent/registry011/admission_candidate_settlement.go': [0, 0],
              'pkg/agent/registry011/admission_candidate_ledger.go': [0, 0],
              'pkg/agent/registry011/admission_candidate_ledger_replay.go': [0, 0],
              'pkg/agent/registry011/node_identity.go': [0, 0],
              'pkg/agent/registry011/provider_history_typed_spine.go': [0, 0],
          }
          for line in Path('coverage.out').read_text().splitlines()[1:]:
              location, statements, count = line.split()
              filename = location.rsplit(':', 1)[0]
              for target, totals in targets.items():
                  if filename.endswith('/' + target):
                      totals[0] += int(statements)
                      totals[1] += int(statements) if int(count) else 0
          for target, (total, covered) in targets.items():
              if not total or covered * 100 < total * 90:
                  raise SystemExit(f'{target}: {covered}/{total} statements; requires 90%')
              print(f'Coverage for {target} = {covered / total:.1%}')
          PY

      - name: Verify adopted DID modules and safe consumer runtime
        shell: bash
        env:
          GOWORK: 'off'
        run: |
          mkdir -p "$RUNNER_TEMP/did-consumer-adoption"
          go version > "$RUNNER_TEMP/did-consumer-adoption/go-version.txt"
          go list -m -json github.com/sage-x-project/did-go github.com/sage-x-project/did-go/advanced/sage > "$RUNNER_TEMP/did-consumer-adoption/modules.json"
          python3 - <<'PYMODULES'
          import json, os
          from pathlib import Path
          data = Path(os.environ['RUNNER_TEMP'], 'did-consumer-adoption/modules.json').read_text()
          decoder = json.JSONDecoder()
          modules = {}
          while data.strip():
              module, end = decoder.raw_decode(data.lstrip())
              data = data.lstrip()[end:]
              assert module['Path'] not in modules and not module.get('Replace')
              modules[module['Path']] = (module['Version'], module['Sum'], module['GoModSum'])
          assert modules == {
              'github.com/sage-x-project/did-go': ('v0.0.0-20261018080828-3b7a79c1c326', 'h1:Am4pVUAnGnhje6WZgO19ltbRV1NDCfvmEzQAuwHInM8=', 'h1:Xi8PmTFqnTT9F008Q4MvrZc6KFrtcrXBP/e1dH8mFaQ='),
              'github.com/sage-x-project/did-go/advanced/sage': ('v0.0.0-20261018120945-5fac371e54db', 'h1:E4eJP14M8NrrlO/jafCfGTeWq8jexrs/+dSY6HJOdlI=', 'h1:gkcVUjeYqhRIRSD8YRErTbHy8lQ85ghzay/cs3hA7d8='),
          }
          PYMODULES
          go mod verify > "$RUNNER_TEMP/did-consumer-adoption/modules-verified.txt"
          go test -mod=readonly -race -count=1 -json -run '^TestDIDConsumer' -coverprofile="$RUNNER_TEMP/did-consumer-adoption/coverage.out" ./pkg/agent/didsource010 | tee "$RUNNER_TEMP/did-consumer-adoption/tests.jsonl"
          git diff --exit-code -- go.mod go.sum

      - name: Retain adopted DID consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: did-consumer-adoption
          path: ${{ runner.temp }}/did-consumer-adoption/
          if-no-files-found: error
          retention-days: 14

      - name: Verify handshake key authority with fixed memory units
        run: |
          mkdir -p "$RUNNER_TEMP/handshake-key-authority"
          go version > "$RUNNER_TEMP/handshake-key-authority/compiler.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/handshake-key-authority/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/handshake-key-authority/tree.txt"
          git ls-files -z pkg/agent/hpke pkg/agent/registry010 pkg/agent/did docs/dev/handshake-key-authority.md docs/INDEX.md go.mod go.sum .github/workflows/test.yml | xargs -0 sha256sum > "$RUNNER_TEMP/handshake-key-authority/source.sha256"
          go test -mod=readonly -race -count=1 -json -run '^TestHandshakeKeyAuthorityBoundary010$' ./pkg/agent/hpke > "$RUNNER_TEMP/handshake-key-authority/tests.jsonl"
          cp coverage.out "$RUNNER_TEMP/handshake-key-authority/full-coverage.out"
          go tool cover -func=coverage.out > "$RUNNER_TEMP/handshake-key-authority/full-functions.txt"
          git diff --exit-code

      - name: Retain fixed handshake key authority evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: handshake-key-authority
          path: ${{ runner.temp }}/handshake-key-authority/
          if-no-files-found: error
          retention-days: 14

      - name: Verify informational identity payload authority boundaries
        run: |
          mkdir -p "$RUNNER_TEMP/identity-payload"
          go version > "$RUNNER_TEMP/identity-payload/compiler.txt"
          go test -mod=readonly -race -count=1 -json -run '^TestHTTPInformationalIdentityPayload010$' ./pkg/agent/hpke > "$RUNNER_TEMP/identity-payload/tests.jsonl"
          git rev-parse HEAD > "$RUNNER_TEMP/identity-payload/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/identity-payload/tree.txt"
          sha256sum pkg/agent/hpke/identity_payload010_test.go docs/dev/identity-payload-authority.md docs/INDEX.md .github/workflows/test.yml > "$RUNNER_TEMP/identity-payload/source.sha256"

      - name: Retain informational identity payload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-payload-authority
          path: ${{ runner.temp }}/identity-payload/
          if-no-files-found: error
          retention-days: 14

      - name: Verify authenticated HTTP application metadata
        run: |
          mkdir -p "$RUNNER_TEMP/http-application"
          go version > "$RUNNER_TEMP/http-application/compiler.txt"
          go test -mod=readonly -race -count=1 -json -run '^TestHTTPApplication' -coverprofile="$RUNNER_TEMP/http-application/coverage.out" -covermode=atomic ./pkg/agent/hpke > "$RUNNER_TEMP/http-application/tests.jsonl"
          python3 - <<'PYAPP'
          import os
          from pathlib import Path
          total = covered = 0
          for line in Path(os.environ['RUNNER_TEMP'], 'http-application/coverage.out').read_text().splitlines()[1:]:
              location, statements, count = line.split()
              if location.rsplit(':', 1)[0].endswith('/pkg/agent/hpke/http_application010.go'):
                  total += int(statements)
                  covered += int(statements) if int(count) else 0
          assert total and covered * 100 >= total * 90, (covered, total)
          print(f'HTTP application owner: {covered}/{total} statements')
          PYAPP
          go tool cover -func="$RUNNER_TEMP/http-application/coverage.out" > "$RUNNER_TEMP/http-application/functions.txt"
          python3 - <<'PYCLOCK'
          import os
          from pathlib import Path
          expected = {('owner010.go', 'LocalNow'), ('owner010.go', 'localStamp010'), ('http_application010.go', 'LocalStamp')}
          found = {}
          for line in Path(os.environ['RUNNER_TEMP'], 'http-application/functions.txt').read_text().splitlines():
              fields = line.split()
              if len(fields) != 3:
                  continue
              file = fields[0].rsplit(':', 2)[0].rsplit('/', 1)[-1]
              key = (file, fields[1])
              if key in expected:
                  assert key not in found
                  found[key] = float(fields[2].removesuffix('%'))
          assert set(found) == expected and all(p >= 90 for p in found.values()), found
          print('Shared local sample coverage:', found)
          PYCLOCK
          git rev-parse HEAD > "$RUNNER_TEMP/http-application/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/http-application/tree.txt"
          sha256sum pkg/agent/hpke/owner010.go pkg/agent/hpke/http_application_clock010_test.go pkg/agent/hpke/completion010.go pkg/agent/hpke/record010.go pkg/agent/hpke/response010.go pkg/agent/hpke/http010.go pkg/agent/hpke/http_application010.go pkg/agent/hpke/http_application010_test.go docs/dev/http-application-metadata.md docs/INDEX.md .github/workflows/test.yml > "$RUNNER_TEMP/http-application/source.sha256"

      - name: Retain authenticated HTTP application evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: http-application-metadata
          path: ${{ runner.temp }}/http-application/
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.html
            coverage.out
            coverage-other.out
            packages-all.txt
            packages-other.txt
            registry-source-reuse.json
          if-no-files-found: error
          retention-days: 7

  # Go contract bindings must match the ABIs published by sage-contracts at
  # the commit pinned in .contracts-version (contract tests, Slither and
  # solhint run in that repository).
  bindings:
    name: Contract Bindings (sage-contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned sage-contracts commit
        id: pin
        run: echo "ref=$(cat .contracts-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout sage-contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-contracts
          ref: ${{ steps.pin.outputs.ref }}
          path: .sage-contracts

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check Go contract bindings for drift
        run: make bindings-check

  # Linting and code quality
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          skip-cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Test codegraph file boundaries
        working-directory: tools/codegraph
        run: |
          go test -mod=readonly -race -count=1 -timeout=2m -json -coverprofile="$RUNNER_TEMP/codegraph-io.coverage" -covermode=atomic ./...
          go tool cover -func="$RUNNER_TEMP/codegraph-io.coverage" > "$RUNNER_TEMP/codegraph-functions.txt"
          python3 - "$RUNNER_TEMP/codegraph-functions.txt" <<'PY'
          import json
          import sys
          from decimal import Decimal
          from pathlib import Path
          rows = [line.split() for line in Path(sys.argv[1]).read_text().splitlines()]
          measured = [Decimal(row[2].removesuffix('%')) for row in rows if len(row) == 3 and row[1] == 'readSelectedFile']
          if len(measured) != 1 or measured[0] < Decimal('90'):
              raise SystemExit('readSelectedFile requires one measured coverage result of at least 90%')
          print(json.dumps({'coverage_subject': 'readSelectedFile', 'measured_percent': str(measured[0]), 'required_percent': '90'}))
          PY

      - name: Check layer boundaries (codegraph)
        working-directory: tools/codegraph
        run: go run . -dir ../.. -out /tmp/codegraph -layer-baseline layer-baseline.txt

      - name: Check that pkg has no init() registrations
        run: bash tools/scripts/check-no-init.sh

      - name: Check Go version consistency (go.mod, Dockerfiles, workflows)
        run: bash tools/scripts/check-go-version.sh

      - name: Check that docs/INDEX.md is generated from the current documents
        run: python3 tools/scripts/gen-docs-index.py --check

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l . || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Go code is not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

  # Build verification
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binaries
        run: make build

      - name: Compile Registry verification package
        shell: bash
        run: go test -mod=readonly -c -o "$RUNNER_TEMP/registry011.test" ./pkg/agent/registry011

      - name: Verify binaries
        shell: bash
        run: |
          ./build/bin/sage-crypto help
          ./build/bin/sage-did help
          ./build/bin/sage-verify help || true

  # Protocol test vectors published in the sage-spec repository: this
  # implementation must reproduce (deterministic) or verify (verify-only)
  # every vector. A failure here means the wire format drifted from the
  # specification; regenerate with `make vectors` and open a sage-spec PR
  # only when the change is intended.
  spec-vectors:
    name: Spec Vectors (sage-spec)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout sage-spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-spec
          ref: main
          path: .sage-spec

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check vectors
        run: go run ./cmd/sage-vectors check -dir .sage-spec/vectors
