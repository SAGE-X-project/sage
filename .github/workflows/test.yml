name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.2'
  GOTOOLCHAIN: auto

jobs:
  # Go backend tests
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.2']

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage and race detector
        run: |
          # Combine test execution to avoid redundant runs
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-report
          path: coverage.html

  # Smart contract tests
  test-contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: contracts/ethereum/package-lock.json

      - name: Install dependencies
        working-directory: contracts/ethereum
        run: npm ci

      - name: Run Hardhat tests
        working-directory: contracts/ethereum
        run: npm test

      # Coverage disabled due to timeout issues with complex contracts
      # - name: Generate coverage report
      #   working-directory: contracts/ethereum
      #   run: npm run coverage
      #
      # - name: Upload coverage artifact
      #   uses: actions/upload-artifact@v5
      #   with:
      #     name: contracts-coverage
      #     path: contracts/ethereum/coverage

  # Linting and code quality
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          args: --timeout=5m
          skip-cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v "contracts/ethereum/bindings/go/example.go" || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Go code is not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Set up Node.js for Solidity linting
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: contracts/ethereum/package-lock.json

      - name: Install contract dependencies
        working-directory: contracts/ethereum
        run: npm ci

      - name: Run Solidity linting
        working-directory: contracts/ethereum
        run: npx solhint 'contracts/**/*.sol'

  # Build verification
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binaries
        run: make build

      - name: Verify binaries
        shell: bash
        run: |
          ./build/bin/sage-crypto help
          ./build/bin/sage-did help
          ./build/bin/sage-verify help || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: binaries-${{ matrix.os }}
          path: build/bin/
          retention-days: 7

  # Feature verification (88 automated tests from FEATURE_TEST_GUIDE_KR.md)
  feature-verification:
    name: Feature Verification (88 Tests)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: binaries-ubuntu-latest
          path: build/bin/

      - name: Set binary permissions
        run: chmod +x build/bin/*

      - name: Run feature verification
        run: |
          chmod +x tools/scripts/verify_all_features.sh
          ./tools/scripts/verify_all_features.sh --skip-integration

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: feature-verification-logs
          path: /tmp/sage-test-logs/
          retention-days: 7

      - name: Display verification summary
        if: always()
        run: |
          echo "### Feature Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "/tmp/sage-test-logs/test_all_units.log" ]; then
            echo " Feature verification completed" >> $GITHUB_STEP_SUMMARY
            echo "- 88 automated tests executed" >> $GITHUB_STEP_SUMMARY
            echo "- Blockchain integration tests run separately in integration-test workflow" >> $GITHUB_STEP_SUMMARY
          else
            echo " Feature verification failed" >> $GITHUB_STEP_SUMMARY
          fi
