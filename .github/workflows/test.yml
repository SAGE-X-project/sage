name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  GO_VERSION: '1.26.8'
  GOTOOLCHAIN: auto
  GOFLAGS: -mod=readonly

jobs:
  # Go backend tests
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.8']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: go mod download && go mod verify

      - name: Run tests with coverage and race detector
        run: |
          # Combine test execution to avoid redundant runs
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.html

  # Smart contract tests
  test-contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: contracts/ethereum/package-lock.json

      - name: Install dependencies
        working-directory: contracts/ethereum
        run: npm ci --ignore-scripts

      - name: Run Hardhat tests
        working-directory: contracts/ethereum
        run: npm test

      # The Go bindings under pkg/blockchain/ethereum/contracts are generated
      # from these artifacts; fail if a contract change was not regenerated.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check Go contract bindings for drift
        run: make bindings-check

      # Coverage disabled due to timeout issues with complex contracts
      # - name: Generate coverage report
      #   working-directory: contracts/ethereum
      #   run: npm run coverage
      #
      # - name: Upload coverage artifact
      #   uses: actions/upload-artifact@v5
      #   with:
      #     name: contracts-coverage
      #     path: contracts/ethereum/coverage

  # Linting and code quality
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          skip-cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check layer boundaries (codegraph)
        working-directory: tools/codegraph
        run: go run . -dir ../.. -out /tmp/codegraph -layer-baseline layer-baseline.txt

      - name: Check that pkg has no init() registrations
        run: bash tools/scripts/check-no-init.sh

      - name: Check Go version consistency (go.mod, Dockerfiles, workflows)
        run: bash tools/scripts/check-go-version.sh

      - name: Check that docs/INDEX.md is generated from the current documents
        run: python3 tools/scripts/gen-docs-index.py --check

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l . || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Go code is not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Set up Node.js for Solidity linting
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: contracts/ethereum/package-lock.json

      - name: Install contract dependencies
        working-directory: contracts/ethereum
        run: npm ci --ignore-scripts

      - name: Run Solidity linting
        working-directory: contracts/ethereum
        run: npx solhint 'contracts/**/*.sol'

  # Build verification
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binaries
        run: make build

      - name: Verify binaries
        shell: bash
        run: |
          ./build/bin/sage-crypto help
          ./build/bin/sage-did help
          ./build/bin/sage-verify help || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.os }}
          path: build/bin/
          retention-days: 7

  # Feature verification (88 automated tests from FEATURE_TEST_GUIDE_KR.md)
  feature-verification:
    name: Feature Verification (88 Tests)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download && go mod verify

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-ubuntu-latest
          path: build/bin/

      - name: Set binary permissions
        run: chmod +x build/bin/*

      - name: Run feature verification
        run: |
          chmod +x tools/scripts/verify_all_features.sh
          ./tools/scripts/verify_all_features.sh --skip-integration

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-verification-logs
          path: /tmp/sage-test-logs/
          retention-days: 7

      - name: Display verification summary
        if: always()
        run: |
          echo "### Feature Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "/tmp/sage-test-logs/test_all_units.log" ]; then
            echo " Feature verification completed" >> $GITHUB_STEP_SUMMARY
            echo "- 88 automated tests executed" >> $GITHUB_STEP_SUMMARY
            echo "- Blockchain integration tests run separately in integration-test workflow" >> $GITHUB_STEP_SUMMARY
          else
            echo " Feature verification failed" >> $GITHUB_STEP_SUMMARY
          fi
