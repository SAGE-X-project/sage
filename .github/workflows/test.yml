name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.10'
  GOTOOLCHAIN: auto
  GOFLAGS: -mod=readonly

jobs:
  # Keep finite runner headroom for race-enabled Registry evidence.
  # The required Go Tests job explicitly gates on this job's success.
  registry_fixture_check:
    name: Registry Fixture Check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Check bounded recovery fixture before complete partitions
        run: |
          registry_fixture_dir="$RUNNER_TEMP/registry-fixture-check"
          mkdir -p "$registry_fixture_dir"
          go version > "$registry_fixture_dir/compiler.txt"
          git rev-parse HEAD > "$registry_fixture_dir/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$registry_fixture_dir/tree.txt"
          git ls-files -z pkg/agent/registry011 go.mod go.sum .github/workflows/test.yml .github/workflows/registry-node-evidence.yml | xargs -0 sha256sum > "$registry_fixture_dir/source.sha256"
          # This early unit result never replaces full partitions or their coverage.
          go test -mod=readonly -race -count=1 -timeout=2m -json -run '^TestProviderHistoryRecoveryInitialNamesKeepEveryFiniteCapacityPrefix$' ./pkg/agent/registry011 > "$registry_fixture_dir/tests.jsonl"
          git diff --exit-code
      - name: Check original references before complete partitions
        run: |
          registry_fixture_dir="$RUNNER_TEMP/registry-fixture-check"
          reference_status=0
          # Owned UNIT checks only; full partitions and coverage remain required.
          go test -mod=readonly -race -count=1 -timeout=8m -json -run '^(TestProviderHistoryCheckpointPreparationRejectsIncompletePhaseAndCapacityData|TestProviderHistoryFailedSettlementRechecksItsActualCompletedPrefix|TestProviderHistoryFailedSettlementShapesRequireOriginalFailureAndPrefixMetadata|TestProviderHistoryFirstOriginalClosureRejectsMissingAndChangedPrivateReferences|TestProviderHistoryInitialCheckpointRejectsMissingPrivateHeadWithoutPublishingData|TestProviderHistoryMemberContextUpperMatchesIndependentLiterals|TestProviderHistoryMemberContextTypeCeilingsMatchActualWalks|TestProviderHistoryMemberContextBoundCoversGenuineClaimsAndArchivedFacts|TestProviderHistoryMemberContextShortageKeepsOriginalWalkPrefix|TestProviderHistoryReconstructionFullIntervalQuoteDoesNotQualifySmallCatalog|TestProviderHistoryRecoveryGroupReadRefusesAbsentContextBeforeOriginalInput|TestProviderHistoryRecoveryGroupRejectsInconsistentInitialAndWholeChainData|TestProviderHistoryRecoveryLegacyReferencesCannotReplaceCompleteOriginalFrames|TestProviderHistoryRecoveryLegacyRejectsUnplannedSetupAndDifferentFinalRoots|TestProviderHistorySettlementRejectsChangedConsumedOriginalBeforePublication|TestProviderHistorySourcePlanReportsFullSpanCostsWithoutAuthority|TestProviderHistorySourcePlanKeepsItsSelectionAfterCallerUpdates|TestProviderHistorySourcePlanWithholdsPartialResultOnRefusal|TestProviderHistorySourcePlanCannotBeRestoredFromJSON|TestProviderHistorySourceSnapshotDetachesSelectedPointers|TestProviderHistorySourceSnapshotRefusesIncompleteSelection|TestProviderHistorySourceSnapshotReconstructsManifestInsteadOfTrustingSeal|TestProviderScanOpenClosesPreselectedReadersAfterRootLockRefusal|TestProviderHistorySourceInputCopyDoesNotKeepCallerStringBacking|TestProviderHistorySourcePlanRetainsDetachedClockTextAndExactOrigin|TestProviderHistorySourceInputPreflightRefusesUnboundedCopyInputs|TestProviderHistorySourcePlanRejectsImpossiblePayloadBeforeGroupEnumeration|TestProviderHistorySourcePayloadDomainRetainsSmallUnqualifiedPlan|TestProviderHistorySourcePayloadDomainIncludesTheExactAbsoluteBoundary|TestProviderHistorySourcePayloadDomainRejectsIncompleteStorageInputs)$' ./pkg/agent/registry011 > "$registry_fixture_dir/reference-tests.jsonl" || reference_status=$?
          printf '%s\n' "$reference_status" > "$registry_fixture_dir/reference-tests.exit"
          git diff --exit-code
          exit "$reference_status"
      - name: Retain recovery fixture check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-fixture-check
          path: ${{ runner.temp }}/registry-fixture-check/
          if-no-files-found: error
          retention-days: 14

  registry_source_shard:
    needs: registry_fixture_check
    name: Registry Source Shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    timeout-minutes: 135

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download && go mod verify

      - name: Verify Registry Source clock and checkpoint checks
        run: |
          mkdir -p "$RUNNER_TEMP/registry-source-checks/source"
          go version > "$RUNNER_TEMP/registry-source-checks/compiler.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/registry-source-checks/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/registry-source-checks/tree.txt"
          git ls-files -z .github/scripts/registry_test_shards.py .github/scripts/test_registry_test_shards.py pkg/agent/registry011 docs/dev/registry-source-checks.md docs/dev/agent-embedding.md docs/INDEX.md go.mod go.sum .github/workflows/test.yml .github/workflows/registry-node-evidence.yml .gitleaks.toml | xargs -0 sha256sum > "$RUNNER_TEMP/registry-source-checks/source.sha256"
          cp pkg/agent/registry011/*.go pkg/agent/registry011/*.json "$RUNNER_TEMP/registry-source-checks/source/"
          cp -R pkg/agent/registry011/testdata "$RUNNER_TEMP/registry-source-checks/source/"
          python3 - <<'PYSOURCE'
          import json, os
          from pathlib import Path
          names = ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_REF', 'GITHUB_REPOSITORY']
          Path(os.environ['RUNNER_TEMP'], 'registry-source-checks', 'context.json').write_text(json.dumps({name: os.environ[name] for name in names}, indent=2) + '\n')
          PYSOURCE
          # Check the recent fixture and native-byte regressions before the full suite.
          # This separate log neither supplies coverage nor replaces complete evidence.
          if [ "${{ matrix.shard }}" = "0" ]; then
            go test -mod=readonly -race -count=1 -timeout=2m -json -run '^(TestProviderHistoryMemberReplayCopyOwnsBehaviorOutsideSemanticRoot|TestProviderHistoryNativeBlockEncodingPreservesCompleteRecordedBytes|TestProviderHistoryNativeBlockEncodingKeepsFailedOriginalAllowance|TestProviderHistoryResultsBindExactOriginalsToEveryOrdinal|TestProviderHistoryResultPackRevalidatesContextOnEveryCall|TestProviderHistoryResultPackKeepsLastMemberBindings|TestProviderHistoryProgramKeepsRecoveryAndSelectionBindings|TestProviderHistoryProgramRefusesReplacementOriginalAndSelectedInputs|TestProviderBufferedHeadKeepsBytesEventsAndReaderPosition|TestProviderBufferedHeadKeepsExactInsufficientWorkPrefix|TestProviderBufferedHeadRechecksOwnerOnEveryCall|TestProviderHistoryCollectionRecordedManifestKeepsJournalIdentity|TestProviderHistoryRecoveryUnusedSealsRejectUnexpectedState)$' ./pkg/agent/registry011 > "$RUNNER_TEMP/registry-source-checks/regression-controls.jsonl"
          fi

      - name: Check Registry evidence partition scenarios
        if: matrix.shard == 0
        run: |
          registry_unit_dir="$RUNNER_TEMP/registry-source-checks/partition-unit-coverage"
          mkdir -p "$registry_unit_dir"
          python3 - "$registry_unit_dir" > "$RUNNER_TEMP/registry-source-checks/partition-unit-tests.txt" 2>&1 <<'PYPARTITIONCOVER'
          from pathlib import Path
          import runpy, sys, trace
          directory = Path(sys.argv[1])
          script = Path('.github/scripts/test_registry_test_shards.py').resolve()
          sys.path.insert(0, str(script.parent))
          sys.argv = [str(script)]
          tracer = trace.Trace(count=True, trace=False)
          status = 0
          try:
              tracer.runfunc(runpy.run_path, str(script), run_name='__main__')
          except SystemExit as exit:
              status = exit.code if isinstance(exit.code, int) else int(exit.code is not None)
          finally:
              tracer.results().write_results(show_missing=True, coverdir=str(directory))
          if status:
              raise SystemExit(status)
          from pathlib import Path
          import re, sys
          files = list(directory.rglob('registry_test_shards.cover'))
          if len(files) != 1:
              raise SystemExit('Missing unique Registry evidence helper coverage')
          lines = files[0].read_text().splitlines()
          covered = sum(bool(re.match(r'^\s*\d+:', line)) for line in lines)
          missed = sum(line.startswith('>>>>>>') for line in lines)
          if not covered or covered * 100 < (covered + missed) * 90:
              raise SystemExit(f'Registry evidence helper: {covered}/{covered + missed}; requires 90%')
          print(f'Registry evidence helper: {covered}/{covered + missed}; at least 90%')
          PYPARTITIONCOVER

      - name: Measure maximum Registry dispatch
        if: matrix.shard == 0
        run: |
          # Profile one genuine maximum-member control separately from full-suite evidence.
          # Preserve failed diagnostics and every native window and coverage gate.
          registry_profile_status=0
          go test -mod=readonly -race -count=1 -timeout=8m -json -run '^TestProviderHistoryMemberDispatchRetainsOneSeveralAndMaximumOrdinals$/^32$' -cpuprofile="$RUNNER_TEMP/registry-source-checks/cpu-profile.pprof" -o "$RUNNER_TEMP/registry-source-checks/registry-cpu.test" -coverprofile="$RUNNER_TEMP/registry-source-checks/cpu-profile-coverage.out" -covermode=atomic ./pkg/agent/registry011 > "$RUNNER_TEMP/registry-source-checks/cpu-profile-tests.jsonl" || registry_profile_status=$?
          printf '%s\n' "$registry_profile_status" > "$RUNNER_TEMP/registry-source-checks/cpu-profile.exit"
          go tool pprof -top -nodecount=50 -sample_index=cpu "$RUNNER_TEMP/registry-source-checks/registry-cpu.test" "$RUNNER_TEMP/registry-source-checks/cpu-profile.pprof" > "$RUNNER_TEMP/registry-source-checks/cpu-profile-flat.txt"
          go tool pprof -top -cum -nodecount=50 -sample_index=cpu "$RUNNER_TEMP/registry-source-checks/registry-cpu.test" "$RUNNER_TEMP/registry-source-checks/cpu-profile.pprof" > "$RUNNER_TEMP/registry-source-checks/cpu-profile-cumulative.txt"
          sha256sum "$RUNNER_TEMP/registry-source-checks/registry-cpu.test" "$RUNNER_TEMP/registry-source-checks/cpu-profile.pprof" > "$RUNNER_TEMP/registry-source-checks/cpu-profile.sha256"
          python3 - "$RUNNER_TEMP/registry-source-checks/cpu-profile-tests.jsonl" <<'PYPROFILE'
          import json, sys
          from pathlib import Path
          target = 'TestProviderHistoryMemberDispatchRetainsOneSeveralAndMaximumOrdinals/32'
          events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          starts = [e for e in events if e.get('Test') == target and e.get('Action') == 'run']
          ends = [e for e in events if e.get('Test') == target and e.get('Action') in ('pass', 'fail')]
          if len(starts) != 1 or len(ends) != 1:
              raise SystemExit('CPU diagnostic has no complete maximum-member test result')
          PYPROFILE
          # Compare instrumentation only after the original race diagnostic failed.
          # A separate fresh invocation cannot restore that failed job or qualify full evidence.
          if [ "$registry_profile_status" -ne 0 ]; then
            registry_comparison_status=0
            printf '%s\n' 'no-race; atomic coverage and CPU sampling retained; diagnostic only' > "$RUNNER_TEMP/registry-source-checks/cpu-comparison-mode.txt"
            go test -mod=readonly -count=1 -timeout=8m -json -run '^TestProviderHistoryMemberDispatchRetainsOneSeveralAndMaximumOrdinals$/^32$' -cpuprofile="$RUNNER_TEMP/registry-source-checks/cpu-comparison.pprof" -o "$RUNNER_TEMP/registry-source-checks/registry-cpu-comparison.test" -coverprofile="$RUNNER_TEMP/registry-source-checks/cpu-comparison-coverage.out" -covermode=atomic ./pkg/agent/registry011 > "$RUNNER_TEMP/registry-source-checks/cpu-comparison-tests.jsonl" || registry_comparison_status=$?
            printf '%s\n' "$registry_comparison_status" > "$RUNNER_TEMP/registry-source-checks/cpu-comparison.exit"
            go tool pprof -top -nodecount=50 -sample_index=cpu "$RUNNER_TEMP/registry-source-checks/registry-cpu-comparison.test" "$RUNNER_TEMP/registry-source-checks/cpu-comparison.pprof" > "$RUNNER_TEMP/registry-source-checks/cpu-comparison-flat.txt"
            go tool pprof -top -cum -nodecount=50 -sample_index=cpu "$RUNNER_TEMP/registry-source-checks/registry-cpu-comparison.test" "$RUNNER_TEMP/registry-source-checks/cpu-comparison.pprof" > "$RUNNER_TEMP/registry-source-checks/cpu-comparison-cumulative.txt"
            sha256sum "$RUNNER_TEMP/registry-source-checks/registry-cpu-comparison.test" "$RUNNER_TEMP/registry-source-checks/cpu-comparison.pprof" > "$RUNNER_TEMP/registry-source-checks/cpu-comparison.sha256"
            python3 - "$RUNNER_TEMP/registry-source-checks/cpu-comparison-tests.jsonl" <<'PYCOMPARISON'
          import json, sys
          from pathlib import Path
          target = 'TestProviderHistoryMemberDispatchRetainsOneSeveralAndMaximumOrdinals/32'
          events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          starts = [e for e in events if e.get('Test') == target and e.get('Action') == 'run']
          ends = [e for e in events if e.get('Test') == target and e.get('Action') in ('pass', 'fail')]
          if len(starts) != 1 or len(ends) != 1:
              raise SystemExit('CPU comparison has no complete maximum-member test result')
          PYCOMPARISON
          fi
          test "$registry_profile_status" -eq 0

      - name: Run complete Registry test partition
        run: |
          registry_shard_dir="$RUNNER_TEMP/registry-source-checks"
          go test -mod=readonly -race -count=1 -cover -covermode=atomic -list . -json ./pkg/agent/registry011 > "$registry_shard_dir/test-discovery.jsonl"
          python3 .github/scripts/registry_test_shards.py plan source "$registry_shard_dir" --index '${{ matrix.shard }}'
          registry_profile_args=()
          if [ "${{ matrix.shard }}" = "8" ]; then
            registry_profile_args=(-cpuprofile="$registry_shard_dir/recovery-profile.pprof" -o "$registry_shard_dir/registry-recovery.test")
          fi
          registry_shard_status=0
          go test -mod=readonly -race -count=1 -timeout=120m -json -run "$(cat "$registry_shard_dir/run-pattern.txt")" "${registry_profile_args[@]}" -coverprofile="$registry_shard_dir/coverage.out" -covermode=atomic ./pkg/agent/registry011 > "$registry_shard_dir/tests.jsonl" || registry_shard_status=$?
          printf '%s\n' "$registry_shard_status" > "$registry_shard_dir/partition.exit"
          if [ "${{ matrix.shard }}" = "8" ] && [ -s "$registry_shard_dir/registry-recovery.test" ] && [ -s "$registry_shard_dir/recovery-profile.pprof" ]; then
            go tool pprof -top -nodecount=50 -sample_index=cpu "$registry_shard_dir/registry-recovery.test" "$registry_shard_dir/recovery-profile.pprof" > "$registry_shard_dir/recovery-profile-flat.txt"
            go tool pprof -top -cum -nodecount=50 -sample_index=cpu "$registry_shard_dir/registry-recovery.test" "$registry_shard_dir/recovery-profile.pprof" > "$registry_shard_dir/recovery-profile-cumulative.txt"
            sha256sum "$registry_shard_dir/registry-recovery.test" "$registry_shard_dir/recovery-profile.pprof" > "$registry_shard_dir/recovery-profile.sha256"
          fi
          test "$registry_shard_status" -eq 0
          git diff --exit-code

      - name: Retain Registry Source clock and checkpoint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-source-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/registry-source-checks/
          if-no-files-found: error
          retention-days: 14

  registry_source_checks:
    name: Registry Source Checks
    needs: registry_source_shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every Registry Source partition
        env:
          REGISTRY_SHARD_RESULT: ${{ needs.registry_source_shard.result }}
        run: test "$REGISTRY_SHARD_RESULT" = "success"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Download original Registry Source partitions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: registry-source-shard-*
          path: ${{ runner.temp }}/registry-source-partitions
      - name: Verify complete Registry Source evidence and merge coverage
        run: |
          python3 .github/scripts/registry_test_shards.py assemble source "$RUNNER_TEMP/registry-source-partitions" --output "$RUNNER_TEMP/registry-source-checks" > "$RUNNER_TEMP/registry-source-partition-assembly.json"
          python3 .github/scripts/registry_test_shards.py verify source "$RUNNER_TEMP/registry-source-checks"
          go tool cover -func="$RUNNER_TEMP/registry-source-checks/coverage.out" > "$RUNNER_TEMP/registry-source-checks/functions.txt"
          git diff --exit-code
      - name: Retain complete Registry Source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-source-checks
          path: ${{ runner.temp }}/registry-source-checks/
          if-no-files-found: error
          retention-days: 14

  # Go tests with the race detector. The job name carries no Go version so
  # the branch ruleset that requires it does not go stale on a toolchain bump.
  test-go:
    name: Go Tests
    needs: registry_source_checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Require successful Registry Source evidence
        env:
          REGISTRY_SOURCE_RESULT: ${{ needs.registry_source_checks.result }}
        run: test "$REGISTRY_SOURCE_RESULT" = "success"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download && go mod verify

      - name: Download successful Registry Source evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: registry-source-checks
          path: ${{ runner.temp }}/verified-registry-source

      - name: Verify Registry evidence and partition the complete package set
        run: |
          go list ./... > packages-all.txt
          python3 .github/scripts/registry_test_shards.py verify source "$RUNNER_TEMP/verified-registry-source" > registry-partition-verified.json
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP'], 'verified-registry-source')
          context = json.loads((source / 'context.json').read_text())
          for name in ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_REF', 'GITHUB_REPOSITORY']:
              if context.get(name) != os.environ[name]:
                  raise SystemExit(f'Registry Source evidence context mismatch: {name}')
          source_attempt = int(context['GITHUB_RUN_ATTEMPT'])
          if context.get('GITHUB_JOB') != 'registry_source_checks' or not 1 <= source_attempt <= int(os.environ['GITHUB_RUN_ATTEMPT']):
              raise SystemExit('Registry Source job or attempt mismatch')
          for filename, args in [('revision.txt', ['git', 'rev-parse', 'HEAD']), ('tree.txt', ['git', 'rev-parse', 'HEAD^{tree}']), ('compiler.txt', ['go', 'version'])]:
              if (source / filename).read_text() != subprocess.check_output(args, text=True):
                  raise SystemExit(f'Registry Source evidence identity mismatch: {filename}')
          paths = ['.github/scripts/registry_test_shards.py', '.github/scripts/test_registry_test_shards.py', 'pkg/agent/registry011', 'docs/dev/registry-source-checks.md', 'docs/dev/agent-embedding.md', 'docs/INDEX.md', 'go.mod', 'go.sum', '.github/workflows/test.yml', '.github/workflows/registry-node-evidence.yml', '.gitleaks.toml']
          tracked = subprocess.check_output(['git', 'ls-files', '-z', *paths]).decode().split('\0')[:-1]
          expected = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in tracked}
          recorded = {}
          for line in (source / 'source.sha256').read_text().splitlines():
              digest, name = line.split('  ', 1)
              if name in recorded:
                  raise SystemExit('Duplicate Registry Source file identity')
              recorded[name] = digest
          if not expected or recorded != expected:
              raise SystemExit('Registry Source evidence does not match this complete source selection')
          registry = 'github.com/sage-x-project/sage/pkg/agent/registry011'
          passed, ran = 0, 0
          for line in (source / 'tests.jsonl').read_text().splitlines():
              event = json.loads(line)
              if event.get('Action') == 'fail':
                  raise SystemExit('Registry Source evidence contains a failed test')
              if event.get('Package') == registry:
                  passed += event.get('Action') == 'pass' and not event.get('Test')
                  ran += event.get('Action') == 'run' and bool(event.get('Test'))
          partition = json.loads(Path('registry-partition-verified.json').read_text())
          if partition['role'] != 'source' or partition['shards'] != 9 or passed != partition['package_passes'] or not ran:
              raise SystemExit('Registry Source evidence has no complete successful package run')
          packages = Path('packages-all.txt').read_text().splitlines()
          if len(packages) != len(set(packages)) or packages.count(registry) != 1:
              raise SystemExit('Complete package inventory must contain Registry exactly once')
          remaining = [name for name in packages if name != registry]
          if not remaining:
              raise SystemExit('Remaining package inventory is empty')
          Path('packages-other.txt').write_text('\n'.join(remaining) + '\n')
          receipt = {'registry_package': registry, 'source_run': context['GITHUB_RUN_ID'], 'source_attempt': source_attempt, 'consumer_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'revision': (source / 'revision.txt').read_text().strip(), 'registry_named_runs': ran, 'registry_partition': partition, 'all_packages': packages, 'remaining_packages': remaining}
          Path('registry-source-reuse.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(f'Verified Registry Source package; running every other package: {len(remaining)} of {len(packages)}')
          PY

      - name: Run remaining tests with coverage and race detector
        shell: bash
        run: |
          mapfile -t packages < packages-other.txt
          go test -race -count=1 -timeout=60m -coverprofile=coverage-other.out -covermode=atomic "${packages[@]}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          prefix = 'github.com/sage-x-project/sage/pkg/agent/registry011/'
          registry = Path(os.environ['RUNNER_TEMP'], 'verified-registry-source', 'coverage.out')
          merged, seen = [], set()
          for path, is_registry in [(registry, True), (Path('coverage-other.out'), False)]:
              lines = path.read_text().splitlines()
              if len(lines) < 2 or lines[0] != 'mode: atomic':
                  raise SystemExit(f'Missing atomic coverage: {path}')
              for line in lines[1:]:
                  location, statements, count = line.split()
                  filename = location.rsplit(':', 1)[0]
                  if filename.startswith(prefix) != is_registry or location in seen or int(statements) < 0 or int(count) < 0:
                      raise SystemExit(f'Coverage source overlap or invalid row: {location}')
                  seen.add(location)
                  merged.append(line)
          Path('coverage.out').write_text('mode: atomic\n' + '\n'.join(merged) + '\n')
          PY
          go tool cover -html=coverage.out -o coverage.html

      - name: Check Registry observation and adapter coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = {
              'pkg/agent/internal/rfc8785/rfc8785.go': [0, 0],
              'pkg/agent/internal/rfc8785/native.go': [0, 0],
              'pkg/agent/registry010/eip155_observer010.go': [0, 0],
              'pkg/agent/didsource010/eip155.go': [0, 0],
              'pkg/agent/registry011/source_checkpoint.go': [0, 0],
              'pkg/agent/registry011/provider_bootstrap_costing.go': [0, 0],
              'pkg/agent/registry011/provider_scan_costing.go': [0, 0],
              'pkg/agent/registry011/provider_scan_control.go': [0, 0],
              'pkg/agent/registry011/provider_history_bootstrap_source_bound.go': [0, 0],
              'pkg/agent/registry011/provider_history_bootstrap_inputs.go': [0, 0],
              'pkg/agent/registry011/provider_history_selected_source.go': [0, 0],
