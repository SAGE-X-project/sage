name: Registry Node Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'pkg/agent/registry011/**'
      - '.github/workflows/registry-node-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'pkg/agent/registry011/**'
      - '.github/workflows/registry-node-evidence.yml'

permissions:
  contents: read

concurrency:
  group: registry-node-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Read existing Sepolia deployment evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Record source and bounded read-only execution
        run: |
          export SAGE_NODE_EVIDENCE_DIR="$RUNNER_TEMP/registry-node-evidence"
          mkdir -p "$SAGE_NODE_EVIDENCE_DIR"
          go version > "$SAGE_NODE_EVIDENCE_DIR/compiler.txt"
          git rev-parse HEAD > "$SAGE_NODE_EVIDENCE_DIR/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$SAGE_NODE_EVIDENCE_DIR/tree.txt"
          git ls-files -z pkg/agent/registry011 go.mod go.sum .github/workflows/registry-node-evidence.yml .github/workflows/test.yml docs/dev/registry-source-checks.md | xargs -0 sha256sum > "$SAGE_NODE_EVIDENCE_DIR/source.sha256"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          names = ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_REF', 'GITHUB_REPOSITORY']
          Path(os.environ['SAGE_NODE_EVIDENCE_DIR'], 'context.json').write_text(json.dumps({name: os.environ[name] for name in names}, indent=2) + '\n')
          PY
          GODEBUG=http2client=0 go mod download -json > "$SAGE_NODE_EVIDENCE_DIR/modules.json" 2> "$SAGE_NODE_EVIDENCE_DIR/modules.stderr"
          go mod verify > "$SAGE_NODE_EVIDENCE_DIR/modules-verify.txt"
          go test -tags=registry_live -mod=readonly -count=1 -json -run '^TestSepoliaNodeEvidenceLive$' ./pkg/agent/registry011 > "$SAGE_NODE_EVIDENCE_DIR/tests.jsonl"
          git diff --exit-code
      - name: Retain original node responses
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-node-evidence
          path: ${{ runner.temp }}/registry-node-evidence/
          if-no-files-found: error
          retention-days: 14

  provider-capture:
    name: Capture candidate provider transport evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Check provider candidates with owned TLS and the selected RPC
        run: |
          export SAGE_PROVIDER_CAPTURE_DIR="$RUNNER_TEMP/provider-transport-capture"
          mkdir -p "$SAGE_PROVIDER_CAPTURE_DIR/source"
          go version > "$SAGE_PROVIDER_CAPTURE_DIR/compiler.txt"
          git rev-parse HEAD > "$SAGE_PROVIDER_CAPTURE_DIR/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$SAGE_PROVIDER_CAPTURE_DIR/tree.txt"
          git ls-files -z pkg/agent/registry011 go.mod go.sum .github/workflows/registry-node-evidence.yml .github/workflows/test.yml docs/dev/registry-source-checks.md | xargs -0 sha256sum > "$SAGE_PROVIDER_CAPTURE_DIR/source.sha256"
          cp pkg/agent/registry011/*.go pkg/agent/registry011/*.json "$SAGE_PROVIDER_CAPTURE_DIR/source/"
          cp -R pkg/agent/registry011/testdata "$SAGE_PROVIDER_CAPTURE_DIR/source/"
          python3 - <<'PYCONTEXT'
          import json, os
          from pathlib import Path
          names = ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_REF', 'GITHUB_REPOSITORY']
          Path(os.environ['SAGE_PROVIDER_CAPTURE_DIR'], 'context.json').write_text(json.dumps({name: os.environ[name] for name in names}, indent=2) + '\n')
          PYCONTEXT
          GODEBUG=http2client=0 go mod download -json > "$SAGE_PROVIDER_CAPTURE_DIR/modules.json" 2> "$SAGE_PROVIDER_CAPTURE_DIR/modules.stderr"
          go mod verify > "$SAGE_PROVIDER_CAPTURE_DIR/modules-verify.txt"
          go test -tags=provider_capture_live -mod=readonly -race -count=1 -json -run '^TestProvider' -coverprofile="$SAGE_PROVIDER_CAPTURE_DIR/coverage.out" -covermode=atomic ./pkg/agent/registry011 > "$SAGE_PROVIDER_CAPTURE_DIR/tests.jsonl"
          go tool cover -func="$SAGE_PROVIDER_CAPTURE_DIR/coverage.out" > "$SAGE_PROVIDER_CAPTURE_DIR/functions.txt"
          python3 - <<'PYCOVERAGE'
          import os
          from pathlib import Path
          targets = {'provider_capture.go': [0, 0], 'provider_http.go': [0, 0]}
          connected = [
              'provider_frontier_intent.go', 'provider_frontier_record.go', 'provider_frontier_retention.go', 'provider_frontier_replay.go',
              'provider_frontier_references.go',
              'provider_frontier_highwater.go',
              'provider_frontier_highwater_retention.go',
              'provider_frontier_cas_files.go',
              'provider_frontier_custody_preflight.go', 'provider_frontier_custody_write.go',
              'provider_frontier_custody_open.go',
              'provider_scan_bounds.go', 'provider_scan_codec.go', 'provider_scan_open.go',
              'provider_scan_control.go', 'provider_scan_control_records.go',
              'provider_scan_initial.go', 'provider_scan_target.go', 'provider_scan_replay.go',
              'provider_replay_codec.go',
              'provider_integration.go', 'provider_integration_admission.go',
              'provider_integration_bootstrap.go', 'provider_integration_budget.go',
              'provider_integration_clock.go', 'provider_integration_exchange.go',
              'provider_integration_history.go', 'provider_integration_io.go',
              'provider_integration_local.go', 'provider_integration_meter.go',
              'provider_integration_method_limits.go', 'provider_integration_objects.go',
              'provider_integration_pin.go', 'provider_integration_pin_replay.go',
              'provider_integration_request.go', 'provider_integration_result.go',
              'provider_integration_setup.go', 'provider_integration_store.go',
              'provider_integration_store_commit.go', 'provider_integration_store_read.go',
              'provider_integration_store_replay.go', 'provider_integration_transport.go',
              'provider_ledger_continuation.go', 'provider_ledger_index_values.go',
              'provider_ledger_indexes.go', 'provider_ledger_limits.go', 'provider_ledger_page.go',
          ]
          for name in connected:
              targets[name] = [0, 0]
          discovered = {
              item.name
              for pattern in ('provider_frontier*.go', 'provider_integration*.go', 'provider_ledger*.go', 'provider_scan*.go', 'provider_replay*.go')
              for item in Path('pkg/agent/registry011').glob(pattern)
              if not item.name.endswith('_test.go')
          }
          assert set(connected) == discovered, ('coverage inventory mismatch', sorted(discovered - set(connected)), sorted(set(connected) - discovered))
          for line in Path(os.environ['SAGE_PROVIDER_CAPTURE_DIR'], 'coverage.out').read_text().splitlines()[1:]:
              location, statements, count = line.split()
              name = location.rsplit(':', 1)[0].rsplit('/', 1)[-1]
              if name in targets:
                  targets[name][0] += int(statements)
                  targets[name][1] += int(statements) if int(count) else 0
          for name, (total, covered) in targets.items():
              assert total and covered * 100 >= total * 90, (name, covered, total)
              print(name, covered, total)
          PYCOVERAGE
          git diff --exit-code
      - name: Retain original candidate capture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-transport-capture
          path: ${{ runner.temp }}/provider-transport-capture/
          if-no-files-found: error
          retention-days: 14
