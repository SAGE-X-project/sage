name: Registry Node Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'pkg/agent/registry011/**'
      - '.github/workflows/registry-node-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'pkg/agent/registry011/**'
      - '.github/workflows/registry-node-evidence.yml'

permissions:
  contents: read

concurrency:
  group: registry-node-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Read existing Sepolia deployment evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Record source and bounded read-only execution
        run: |
          export SAGE_NODE_EVIDENCE_DIR="$RUNNER_TEMP/registry-node-evidence"
          mkdir -p "$SAGE_NODE_EVIDENCE_DIR"
          go version > "$SAGE_NODE_EVIDENCE_DIR/compiler.txt"
          git rev-parse HEAD > "$SAGE_NODE_EVIDENCE_DIR/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$SAGE_NODE_EVIDENCE_DIR/tree.txt"
          git ls-files -z pkg/agent/registry011 go.mod go.sum .github/workflows/registry-node-evidence.yml .github/workflows/test.yml docs/dev/registry-source-checks.md | xargs -0 sha256sum > "$SAGE_NODE_EVIDENCE_DIR/source.sha256"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          names = ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_REF', 'GITHUB_REPOSITORY']
          Path(os.environ['SAGE_NODE_EVIDENCE_DIR'], 'context.json').write_text(json.dumps({name: os.environ[name] for name in names}, indent=2) + '\n')
          PY
          GODEBUG=http2client=0 go mod download -json > "$SAGE_NODE_EVIDENCE_DIR/modules.json" 2> "$SAGE_NODE_EVIDENCE_DIR/modules.stderr"
          go mod verify > "$SAGE_NODE_EVIDENCE_DIR/modules-verify.txt"
          go test -tags=registry_live -mod=readonly -count=1 -json -run '^TestSepoliaNodeEvidenceLive$' ./pkg/agent/registry011 > "$SAGE_NODE_EVIDENCE_DIR/tests.jsonl"
          git diff --exit-code
      - name: Retain original node responses
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-node-evidence
          path: ${{ runner.temp }}/registry-node-evidence/
          if-no-files-found: error
          retention-days: 14

  provider-capture:
    name: Capture candidate provider transport evidence
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Check provider candidates with owned TLS and the selected RPC
        run: |
          export SAGE_PROVIDER_CAPTURE_DIR="$RUNNER_TEMP/provider-transport-capture"
          mkdir -p "$SAGE_PROVIDER_CAPTURE_DIR/source"
          go version > "$SAGE_PROVIDER_CAPTURE_DIR/compiler.txt"
          git rev-parse HEAD > "$SAGE_PROVIDER_CAPTURE_DIR/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$SAGE_PROVIDER_CAPTURE_DIR/tree.txt"
          git ls-files -z pkg/agent/registry011 go.mod go.sum .github/workflows/registry-node-evidence.yml .github/workflows/test.yml docs/dev/registry-source-checks.md | xargs -0 sha256sum > "$SAGE_PROVIDER_CAPTURE_DIR/source.sha256"
          cp pkg/agent/registry011/*.go pkg/agent/registry011/*.json "$SAGE_PROVIDER_CAPTURE_DIR/source/"
          cp -R pkg/agent/registry011/testdata "$SAGE_PROVIDER_CAPTURE_DIR/source/"
          python3 - <<'PYCONTEXT'
          import json, os
          from pathlib import Path
          names = ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_REF', 'GITHUB_REPOSITORY']
          Path(os.environ['SAGE_PROVIDER_CAPTURE_DIR'], 'context.json').write_text(json.dumps({name: os.environ[name] for name in names}, indent=2) + '\n')
          PYCONTEXT
          GODEBUG=http2client=0 go mod download -json > "$SAGE_PROVIDER_CAPTURE_DIR/modules.json" 2> "$SAGE_PROVIDER_CAPTURE_DIR/modules.stderr"
          go mod verify > "$SAGE_PROVIDER_CAPTURE_DIR/modules-verify.txt"
          # Check the recent fixture and native-byte regressions before the full suite.
          # This separate log neither supplies coverage nor replaces complete evidence.
          go test -tags=provider_capture_live -mod=readonly -race -count=1 -timeout=2m -json -run '^(TestProviderHistoryMemberReplayCopyOwnsBehaviorOutsideSemanticRoot|TestProviderHistoryNativeBlockEncodingPreservesCompleteRecordedBytes|TestProviderHistoryNativeBlockEncodingKeepsFailedOriginalAllowance)$' ./pkg/agent/registry011 > "$SAGE_PROVIDER_CAPTURE_DIR/regression-controls.jsonl"
          go test -tags=provider_capture_live -mod=readonly -race -count=1 -timeout=60m -json -run '^(TestProvider|TestNode|TestReplay|TestRootGas|TestErigon|TestNethermind|TestGasProfile|TestStateGas)' -coverprofile="$SAGE_PROVIDER_CAPTURE_DIR/coverage.out" -covermode=atomic ./pkg/agent/registry011 > "$SAGE_PROVIDER_CAPTURE_DIR/tests.jsonl"
