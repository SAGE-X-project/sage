name: Extended checks

# Checks that do not gate pull requests: the feature verification script,
# which repeats most of `go test ./...` through the CLI binaries. Runs
# weekly and on demand.

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.8'
  GOTOOLCHAIN: auto
  GOFLAGS: -mod=readonly

jobs:
  feature-verification:
    name: Feature Verification (88 Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download && go mod verify

      - name: Build binaries
        run: make build

      - name: Run feature verification
        run: |
          chmod +x tools/scripts/verify_all_features.sh
          ./tools/scripts/verify_all_features.sh --skip-integration

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-verification-logs
          path: /tmp/sage-test-logs/
          retention-days: 7
