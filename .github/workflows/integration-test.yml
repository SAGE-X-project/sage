name: Integration Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.8'
  GOTOOLCHAIN: auto
  GOFLAGS: -mod=readonly

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Redis for session cache
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned sage-contracts commit
        id: pin
        run: echo "ref=$(cat .contracts-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout sage-contracts (Hardhat node for the integration tests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-contracts
          ref: ${{ steps.pin.outputs.ref }}
          path: .sage-contracts

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .sage-contracts/ethereum/package-lock.json

      - name: Install Go dependencies
        run: go mod download && go mod verify

      - name: Install contract dependencies
        working-directory: .sage-contracts/ethereum
        run: npm ci --ignore-scripts

      - name: Start Hardhat node
        working-directory: .sage-contracts/ethereum
        run: |
          npx hardhat node --hostname 0.0.0.0 &
          sleep 10

      - name: Wait for services
        run: |
          echo "Waiting for Ethereum node..."
          for i in {1..30}; do
            if curl -s -X POST -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://localhost:8545 | grep -q "result"; then
              echo " Ethereum node is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

          echo "Waiting for Redis..."
          for i in {1..10}; do
            if redis-cli -h localhost ping | grep -q "PONG"; then
              echo " Redis is ready"
              break
            fi
            echo "Waiting... ($i/10)"
            sleep 1
          done

      - name: Set test environment variables
        run: |
          echo "ETHEREUM_RPC_URL=http://localhost:8545" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "SAGE_ENV=test" >> $GITHUB_ENV
          echo "LOG_LEVEL=debug" >> $GITHUB_ENV

      - name: Run integration tests
        run: |
          go test -v -tags=integration ./tests/integration/... \
            -timeout 20m \
            -coverprofile=integration-coverage.out

      - name: Upload integration test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-coverage
          path: integration-coverage.out
          retention-days: 7

      - name: Display test summary
        if: always()
        run: |
          echo "### Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "-  Integration tests completed" >> $GITHUB_STEP_SUMMARY
