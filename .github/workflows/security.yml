name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  # CodeQL analysis
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

  # Dependency scanning
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Go security scanning
  gosec:
    name: Go Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true

      - name: Download dependencies
        run: go mod download && go mod verify

      - name: Install gosec
        run: |
          export GOTOOLCHAIN=local
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run Gosec (reports for code scanning)
        # Non-blocking pass that always produces the JSON and SARIF reports.
        run: |
          gosec -conf .gosec.json -fmt=json -out=gosec-results.json -no-fail ./...
          gosec -conf .gosec.json -fmt=sarif -out=gosec-results-raw.sarif -no-fail ./...

      - name: Run Gosec (blocking)
        # Fails the job on any finding not excluded by .gosec.json.
        run: gosec -conf .gosec.json -fmt=text ./...

      - name: Fix SARIF artifact paths
        if: always()
        continue-on-error: true
        run: |
          if [ -f "gosec-results-raw.sarif" ]; then
            echo "Raw SARIF file found, fixing paths..."
            python3 .github/scripts/fix-sarif-paths.py
            if [ -f "gosec-results.sarif" ]; then
              echo "Fixed SARIF file created successfully"
              echo "SARIF file size: $(wc -c < gosec-results.sarif) bytes"
              echo "Number of results: $(jq '.runs[0].results | length' gosec-results.sarif)"
            else
              echo "ERROR: Failed to create fixed SARIF file"
              exit 1
            fi
          else
            echo "ERROR: No raw SARIF file found to fix"
            echo "Available files:"
            ls -la gosec-* || echo "No gosec files found"
            exit 1
          fi

      - name: Display Gosec Results
        if: always()
        run: |
          if [ -f "gosec-results.json" ]; then
            echo "Gosec scan completed"
            echo "Results summary:"
            jq -r '.Stats // "No issues found"' gosec-results.json
            if [ "$(jq '.Issues | length' gosec-results.json)" -gt "0" ]; then
              echo ""
              echo "Security issues found:"
              jq -r '.Issues[] | "[\(.severity)] \(.file):\(.line) - \(.details)"' gosec-results.json
            fi
          else
            echo "No gosec results file generated"
          fi

      - name: Validate SARIF file before upload
        if: always()
        continue-on-error: true
        run: |
          if [ -f "gosec-results.sarif" ]; then
            echo "SARIF file exists"
            echo "File size: $(wc -c < gosec-results.sarif) bytes"
            # Validate JSON structure
            if jq empty gosec-results.sarif 2>/dev/null; then
              echo "SARIF file is valid JSON"
              echo "SARIF version: $(jq -r '.version' gosec-results.sarif)"
              echo "Tool name: $(jq -r '.runs[0].tool.driver.name' gosec-results.sarif)"
              echo "Number of results: $(jq '.runs[0].results | length' gosec-results.sarif)"
            else
              echo "ERROR: SARIF file is not valid JSON"
              exit 1
            fi
          else
            echo "ERROR: SARIF file not found for upload"
            exit 1
          fi

      - name: Upload Gosec results to GitHub Security
        if: always() && hashFiles('gosec-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: gosec-results.sarif
          category: "gosec"

  # Known-vulnerability check for Go dependencies and the standard library
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26.8'
          go-package: ./...

  # Smart contract security
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: contracts/ethereum
        run: npm ci --ignore-scripts

      - name: Compile contracts for Slither
        working-directory: contracts/ethereum
        run: npx hardhat compile

      - name: Run Slither (blocking on High)
        working-directory: contracts/ethereum
        # crytic-compile >= 0.4 is required to read Hardhat 3 build-info files.
        run: |
          pip3 install slither-analyzer==0.11.6 crytic-compile==0.4.2
          slither . \
            --config-file .slither.config.json \
            --compile-force-framework hardhat \
            --fail-high \
            --sarif slither-results.sarif 2>&1 | tee slither-output.log
          if [ -f "slither-results.sarif" ]; then
            echo "SARIF file generated successfully"
            echo "File size: $(wc -c < slither-results.sarif) bytes"
          else
            echo "ERROR: Slither did not generate SARIF file"
            echo "Slither output:"
            cat slither-output.log
            echo "Exit code: ${PIPESTATUS[0]}"
          fi

      - name: Move SARIF file
        run: |
          if [ -f "contracts/ethereum/slither-results.sarif" ]; then
            mv contracts/ethereum/slither-results.sarif slither-results.sarif
            echo "SARIF file found and moved"
          else
            echo "No SARIF file generated by Slither (0 findings after filtering)"
            echo "Generating empty valid SARIF file..."
            cat > slither-results.sarif << 'SARIF_EOF'
          {
            "version": "2.1.0",
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "Slither",
                    "informationUri": "https://github.com/crytic/slither",
                    "version": "0.0.0",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          SARIF_EOF
            echo "Empty SARIF file generated successfully"
          fi

      - name: Upload Slither results to GitHub Security
        if: always() && hashFiles('slither-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: slither-results.sarif

  # Secret scanning
  gitleaks:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks (full history, blocking)
        # Scans every commit with the allowlist in .gitleaks.toml (public Hardhat
        # accounts, test fixtures, documentation examples). Any other hit fails.
        run: |
          docker run --rm -v "${PWD}:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --verbose

  # License compliance
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true

      - name: Install go-licenses v2
        run: |
          export GOTOOLCHAIN=local
          go install github.com/google/go-licenses/v2@v2.0.1

      - name: Check Go licenses
        # github.com/gagliardetto/treeout is MIT (LICENSE in its repository) but
        # go-licenses cannot locate the file in the module cache.
        run: go-licenses check ./... --include_tests=false --ignore github.com/gagliardetto/treeout

      - name: Check npm licenses
        working-directory: contracts/ethereum
        run: |
          npx --yes license-checker@25.0.1 --summary
          npx --yes license-checker@25.0.1 --failOn "GPL;AGPL"
