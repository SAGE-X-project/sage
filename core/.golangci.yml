version: "2"

# Lint configuration of the nested module github.com/sage-x-project/sage/core.
# The root .golangci.yml does not reach this module.
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
  settings:
    depguard:
      rules:
        core-dependency-budget:
          # The core may import only the standard library, itself and the
          # fixed cryptography modules (draft1-secure-data-design.md §3.1).
          list-mode: strict
          files:
            - "$all"
          allow:
            - $gostd
            - github.com/sage-x-project/sage/core
            - golang.org/x/crypto
            - github.com/decred/dcrd/dcrec/secp256k1/v4
            - filippo.io/edwards25519
  exclusions:
    rules:
      - linters:
          - errcheck
        path: _test\.go
