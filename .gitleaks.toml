# Gitleaks configuration for SAGE.
#
# The default rule set is extended with an allowlist for material that is
# intentionally public: Hardhat's well-known development accounts, key
# fixtures inside test files and documentation, and identifiers that only
# look like secrets (DID multibase keys, Go/Solidity constant names).
# Anything outside these paths and patterns still fails the scan.

title = "SAGE gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public test material and documentation examples"
regexTarget = "match"
paths = [
  '''(^|/)[^/]+_test\.go$''',
  '''^tests/''',
  '''^docs/''',
  '''^examples/''',
  '''^contracts/[^/]*\.md$''',
  '''^contracts/ethereum/[^/]*\.md$''',
  '''^contracts/ethereum/docs/''',
  '''^contracts/ethereum/scripts/test-[^/]*\.js$''',
  '''^contracts/ethereum/deployments/''',
  '''(^|/)README\.md$''',
  '''^\.gitleaksignore$''',
  '''^\.gitleaks\.toml$''',
  '''^api/''',
  '''^sdk/[^/]+/(README|.*\.md)$''',
]
regexes = [
  # Exact SHA256 of the public Inspector source fixture, not an API credential.
  '''hpke-bound-key-invalid\.json["\s:]+39e6d1d36f45b53130404551fb29fab6354736e9b631dad0c110b20be2ec1525\b''',
  # Exact public derived keys from the frozen SAGE 0.10.0 record vectors.
  '''key_hex["\s:]+(?:0fc66e22c946a7622f4bfb9f3e0f901acfe3199348f891e56e6d4f1e43fd5f93|221de416b0ce0cf34cc4559d289ec37a947365967656cea5c79a7fb6cc5f60bb|2a5899795dda1a25f0135381898a07f1d8b568ce61cacf441e77ccbcc17afb6d|8e813ca92c4580f409bb3d0b281a24412c8e86591eab0befd2df79b2104f797f|9b1f13889532013ee3c3f93841d1495521b235cf272b3136bc4831d6852ff8b9|be8483351fc219268f0839a004188ec157eff6fb463c8631aa3361b92ffd8252|c3a89552907e15483754f111e2460fd86a7eed19948cf21b9da1be328c7491bd|f6175cf0d50d04f039693b1c1c40606f92f603d1c2ba8226f5c9e1a05dcacb2a)\b''',
  # Hardhat default development accounts (publicly documented).
  '''(?i)0x?(ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80|59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d|5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a|7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6|47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a|8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba|92db14e403b83dfe3df233f83dfa3a0d7096f21ca9b0d6d6b8d88b2b4ec1564e|4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356|dbda1821b80551c9d65939329250298aa3472ba22feea921c0cf5d620ea67b97|2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6)''',
  # did:key multibase public keys are not secrets.
  '''z6Mk[1-9A-HJ-NP-Za-km-z]{40,}''',
  # Identifier-shaped false positives (Go/Solidity constant and method names).
  '''(?i)(EncryptAndSign|ApproveEd25519|SECP256K1_[A-Z_]+|Ed25519Verif|X25519KeyAgr|ed25519Count)''',
]
